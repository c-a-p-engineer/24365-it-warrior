<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="24365 IT戦士 ― 目grep。流れるログから条件に合う行を見つけ、ライフが尽きるまで耐えるスマホゲーム。">
  <link rel="canonical" href="https://c-a-p-engineer.github.io/24365-it-warrior/">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="24365 IT戦士">
  <meta property="og:title" content="24365 IT戦士 ― 目grep">
  <meta property="og:description" content="流れるログから条件に合う行を見つけろ。見落とすたびにライフ減少、ログは徐々に加速する。">
  <meta property="og:url" content="https://c-a-p-engineer.github.io/24365-it-warrior/">
  <meta property="og:image" content="https://c-a-p-engineer.github.io/24365-it-warrior/assets/logo/24365-it-warrior-logo.png">
  <meta property="og:image:secure_url" content="https://c-a-p-engineer.github.io/24365-it-warrior/assets/logo/24365-it-warrior-logo.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="24365 IT戦士 ― 目grep ロゴ">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="24365 IT戦士 ― 目grep">
  <meta name="twitter:description" content="流れるログから条件に合う行を見つける、ライフ制の高速探索ゲーム。">
  <meta name="twitter:image" content="https://c-a-p-engineer.github.io/24365-it-warrior/assets/logo/24365-it-warrior-logo.png">
  <meta name="twitter:image:alt" content="24365 IT戦士 ― 目grep ロゴ">

  <link rel="icon" type="image/png" href="./assets/logo/24365-it-warrior-logo.png">
  <link rel="apple-touch-icon" href="./assets/logo/24365-it-warrior-logo.png">
  <link rel="preload" as="image" href="./assets/logo/24365-it-warrior-logo.png">

  <title>24365 IT戦士 ― 目grep</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .title-logo{display:block;width:min(100%,430px);max-height:38dvh;margin:0 auto 10px;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.28))}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-height:700px){.title-logo{max-height:30dvh}}
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="title-screen" class="screen title-screen">
      <img class="title-logo" src="./assets/logo/24365-it-warrior-logo.png" alt="24365 IT戦士 ― 目grep">
      <h1 class="sr-only">24365 IT戦士 ― 目grep</h1>
      <p class="lead">流れるログから、見本と同じ異常を見つけろ。<br>見落とすたびにライフ減少。ログは徐々に加速する。</p>
      <div id="best-record" class="best-record"></div>
      <button id="start-button" class="primary-button" type="button">監視を開始</button>
    </section>

    <section id="game-screen" class="screen game-screen hidden" aria-label="目grepゲーム">
      <header class="game-hud">
        <div class="hud-brand"><strong>24365</strong><small>目grep</small></div>
        <div class="hud-metrics">
          <span><small>SCORE</small><b id="score-value">0</b></span>
          <span><small>COMBO</small><b id="combo-value">0</b></span>
          <span><small>LIFE</small><b id="time-value">♥♥♥</b></span>
        </div>
        <button id="pause-button" class="icon-button" type="button" aria-label="一時停止">Ⅱ</button>
      </header>

      <section class="fire-panel">
        <div class="fire-label"><span>⚡ ログ速度</span><b id="fire-value">1.0x</b></div>
        <div class="fire-track"><span id="fire-bar"></span></div>
      </section>

      <section id="target-panel" class="target-panel" aria-label="検索条件">
        <span class="target-icon">🔍</span>
        <div><small>FIND</small><strong id="target-value">ERROR</strong></div>
        <span id="target-count" class="target-count">0 / 3</span>
      </section>

      <section class="terminal-wrap">
        <div class="terminal-head"><span>production.log</span><i></i><i></i><i></i></div>
        <div id="log-lane" class="log-lane" aria-live="polite"></div>
        <div class="scanline" aria-hidden="true"></div>
        <div id="tutorial-hand" class="tutorial-hand hidden" aria-hidden="true">☝️</div>
      </section>

      <section class="operator-panel">
        <div id="operator-face" class="operator-face">🧑‍💻</div>
        <div><strong id="operator-message">監視開始</strong><small id="sub-message">怪しい行をタップ</small></div>
        <div id="accuracy-value" class="accuracy">100%</div>
      </section>
    </section>

    <section id="result-screen" class="screen result-screen hidden">
      <p class="eyebrow">INCIDENT REPORT</p>
      <h2 id="result-title">監視終了</h2>
      <div class="report-grid">
        <div><span>スコア</span><strong id="result-score">0</strong></div>
        <div><span>最大コンボ</span><strong id="result-combo">0</strong></div>
        <div><span>発見件数</span><strong id="result-found">0</strong></div>
        <div><span>正解率</span><strong id="result-accuracy">0%</strong></div>
        <p id="result-comment"></p>
      </div>
      <button id="retry-button" class="primary-button" type="button">もう一度監視</button>
      <button id="back-button" class="text-button" type="button">タイトルへ</button>
    </section>

    <dialog id="pause-dialog" class="modal">
      <h2>一時停止</h2>
      <button id="resume-button" class="primary-button" type="button">再開</button>
      <button id="quit-button" class="secondary-button" type="button">監視終了</button>
    </dialog>
  </main>
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
  <script src="./app.js" defer></script>
</body>
</html>
