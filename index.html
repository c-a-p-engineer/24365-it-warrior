<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="24365 IT戦士 ― 目grep。流れるログから条件に合う行を見つけてタップする短時間スマホゲーム。">
  <title>24365 IT戦士 ― 目grep</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section id="title-screen" class="screen title-screen">
      <div class="title-eye" aria-hidden="true"><span>👁️</span><i></i></div>
      <p class="eyebrow">24 HOURS / 365 DAYS</p>
      <h1>24365 IT戦士</h1>
      <p class="subtitle">目grep</p>
      <p class="lead">流れるログから、見本と同じ異常を見つけろ。</p>
      <div id="best-record" class="best-record"></div>
      <button id="start-button" class="primary-button" type="button">監視を開始</button>
    </section>

    <section id="game-screen" class="screen game-screen hidden" aria-label="目grepゲーム">
      <header class="game-hud">
        <div class="hud-brand"><strong>24365</strong><small>目grep</small></div>
        <div class="hud-metrics">
          <span><small>SCORE</small><b id="score-value">0</b></span>
          <span><small>COMBO</small><b id="combo-value">0</b></span>
          <span><small>TIME</small><b id="time-value">60</b></span>
        </div>
        <button id="pause-button" class="icon-button" type="button" aria-label="一時停止">Ⅱ</button>
      </header>

      <section class="fire-panel">
        <div class="fire-label"><span>🔥 炎上度</span><b id="fire-value">0</b></div>
        <div class="fire-track"><span id="fire-bar"></span></div>
      </section>

      <section class="target-panel" aria-label="検索条件">
        <span class="target-icon">🔍</span>
        <div><small>FIND</small><strong id="target-value">ERROR</strong></div>
        <span id="target-count" class="target-count">0 / 3</span>
      </section>

      <section class="terminal-wrap">
        <div class="terminal-head"><span>production.log</span><i></i><i></i><i></i></div>
        <div id="log-lane" class="log-lane" aria-live="polite"></div>
        <div class="scanline" aria-hidden="true"></div>
        <div id="tutorial-hand" class="tutorial-hand hidden" aria-hidden="true">☝️</div>
      </section>

      <section class="operator-panel">
        <div id="operator-face" class="operator-face">🧑‍💻</div>
        <div><strong id="operator-message">監視開始</strong><small id="sub-message">怪しい行をタップ</small></div>
        <div id="accuracy-value" class="accuracy">100%</div>
      </section>
    </section>

    <section id="result-screen" class="screen result-screen hidden">
      <p class="eyebrow">INCIDENT REPORT</p>
      <h2 id="result-title">監視終了</h2>
      <div class="report-grid">
        <div><span>スコア</span><strong id="result-score">0</strong></div>
        <div><span>最大コンボ</span><strong id="result-combo">0</strong></div>
        <div><span>発見件数</span><strong id="result-found">0</strong></div>
        <div><span>正解率</span><strong id="result-accuracy">0%</strong></div>
        <p id="result-comment"></p>
      </div>
      <button id="retry-button" class="primary-button" type="button">もう一度監視</button>
      <button id="back-button" class="text-button" type="button">タイトルへ</button>
    </section>

    <dialog id="pause-dialog" class="modal">
      <h2>一時停止</h2>
      <button id="resume-button" class="primary-button" type="button">再開</button>
      <button id="quit-button" class="secondary-button" type="button">監視終了</button>
    </dialog>
  </main>
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
  <script src="./app.js" defer></script>
</body>
</html>
